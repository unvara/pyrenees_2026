<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pyrénées Bike Tour</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#06060e;color:#fff;font-family:'Segoe UI',-apple-system,sans-serif;overflow:hidden;}
#hdr{position:fixed;top:0;left:0;right:0;height:44px;z-index:50;background:linear-gradient(135deg,#07070f,#0f0f22);border-bottom:1px solid #1c1c34;display:flex;align-items:center;justify-content:space-between;padding:0 14px;gap:10px;}
#hdr h1{font-size:.88rem;font-weight:700;letter-spacing:.04em;white-space:nowrap;flex-shrink:0;}
#hdr h1 em{color:#60c8ff;font-style:normal;}
.stat-panels{display:flex;gap:6px;flex-shrink:0;}
.rp{display:flex;gap:10px;align-items:center;padding:4px 10px;border-radius:6px;}
.rp.main{background:rgba(96,200,255,.08);border:1px solid rgba(96,200,255,.22);}
.rp.opt{background:rgba(255,160,55,.06);border:1px solid rgba(255,160,55,.2);}
.rtag{font-size:.43rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;margin-bottom:1px;}
.rtag.m{color:#60c8ff;}.rtag.o{color:#ffaa3c;}
.sg .v{font-size:.8rem;font-weight:800;line-height:1;}
.sg .l{font-size:.4rem;text-transform:uppercase;letter-spacing:.09em;color:#404466;margin-top:1px;}
.main .v{color:#c8e8ff;}.opt .v{color:#ffe0b0;}
#leg{position:fixed;top:44px;left:0;right:0;z-index:50;background:rgba(6,6,14,.98);border-bottom:1px solid #181830;padding:3px 10px;}
.leg-row{display:flex;align-items:center;gap:3px;overflow-x:auto;white-space:nowrap;height:20px;}
.leg-row+.leg-row{margin-top:2px;}
.ltag{font-size:.43rem;text-transform:uppercase;letter-spacing:.1em;padding:1px 5px;border-radius:3px;font-weight:700;flex-shrink:0;}
.ltag.m{color:#60c8ff;border:1px solid #60c8ff33;}.ltag.o{color:#ffaa3c;border:1px solid #ffaa3c33;}
.li{display:inline-flex;align-items:center;gap:2px;background:rgba(255,255,255,.05);border-radius:7px;padding:1px 5px 1px 3px;cursor:pointer;font-size:.53rem;flex-shrink:0;}
.li:hover{background:rgba(255,255,255,.09);}.li.dim{opacity:.18;}
.ld{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.ldk{width:13px;height:2px;flex-shrink:0;background:repeating-linear-gradient(90deg,currentColor 0,currentColor 4px,transparent 4px,transparent 7px);}
.lkm{color:#42486a;font-size:.46rem;margin-left:1px;}
#mapCanvas{position:fixed;left:0;display:block;cursor:crosshair;z-index:1;}
#ele-outer{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#040410;border-top:1px solid #181830;display:flex;flex-direction:column;overflow:hidden;}
.ep{flex:1;display:flex;flex-direction:column;padding:3px 12px 1px;min-height:0;overflow:hidden;}
.ep+.ep{border-top:1px solid #0e0e20;}
.elbl{font-size:.41rem;text-transform:uppercase;letter-spacing:.1em;color:#1c1e32;margin-bottom:2px;flex-shrink:0;display:flex;align-items:center;gap:5px;}
.ebadge{font-size:.4rem;padding:1px 4px;border-radius:3px;font-weight:700;}
.ebadge.m{color:#60c8ff;border:1px solid #60c8ff44;}.ebadge.o{color:#ffaa3c;border:1px solid #ffaa3c44;}
canvas.ec{display:block;width:100%;flex:1;cursor:crosshair;min-height:0;}
#etip,#maptip{position:fixed;pointer-events:none;display:none;z-index:9999;white-space:nowrap;border-radius:6px;}
#etip{background:rgba(2,2,12,.96);border:1px solid #22244a;color:#dde;padding:4px 9px;font-size:.67rem;line-height:1.55;}
#maptip{background:rgba(2,2,12,.92);border:1px solid #252848;color:#ccd;padding:3px 8px;font-size:.64rem;}
</style>
</head>

// ── TILES ─────────────────────────────────────────────────────────────────────
const tileCache={};
function getTile(z,tx,ty){
  const key=`${z}/${tx}/${ty}`;
  if(tileCache[key]) return tileCache[key];
  const img=new Image(); img.crossOrigin='anonymous';
  const urls=[
    `https://tile.openstreetmap.org/${z}/${tx}/${ty}.png`,
    `https://a.tile.openstreetmap.org/${z}/${tx}/${ty}.png`,
    `https://b.tile.openstreetmap.org/${z}/${tx}/${ty}.png`,
  ];
  let pi=0;
  img.onerror=()=>{if(++pi<urls.length)img.src=urls[pi];};
  img.onload=()=>{tileCache[key].loaded=true;drawMap();};
  img.src=urls[0];
  return tileCache[key]=img;
}

// ── WEB MERCATOR ──────────────────────────────────────────────────────────────
function ll2px(lat,lon,z){
  const n=Math.pow(2,z),s=Math.sin(lat*Math.PI/180);
  return [(lon+180)/360*n*TILE_SIZE,
          (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*n*TILE_SIZE];
}

const allLats=[...MAIN,...OPT].flatMap(s=>s.map_points.map(p=>p[0]));
const allLons=[...MAIN,...OPT].flatMap(s=>s.map_points.map(p=>p[1]));
const minLat=Math.min(...allLats),maxLat=Math.max(...allLats);
const minLon=Math.min(...allLons),maxLon=Math.max(...allLons);
let tileZoom=8,vpx=null,vpy=null;

function getVH(){return document.documentElement.clientHeight||window.innerHeight;}
function getVW(){return document.documentElement.clientWidth||window.innerWidth;}

function sizeAll(){
  const vw=getVW(),vh=getVH(),mapH=Math.max(60,vh-MAP_TOP-ELE_H);
  mapCanvas.width=vw;mapCanvas.height=mapH;
  mapCanvas.style.cssText=`width:${vw}px;height:${mapH}px;top:${MAP_TOP}px;left:0;position:fixed;`;
  document.getElementById('ele-outer').style.height=ELE_H+'px';
  if(!vpx) fitView();
}

function fitView(){
  const W=mapCanvas.width,H=mapCanvas.height;
  if(!W||!H) return;
  for(let z=12;z>=5;z--){
    const [x0,y0]=ll2px(maxLat,minLon,z),[x1,y1]=ll2px(minLat,maxLon,z);
    if((x1-x0)<W-80&&(y1-y0)<H-80){tileZoom=z;break;}
  }
  [vpx,vpy]=ll2px((minLat+maxLat)/2,(minLon+maxLon)/2,tileZoom);
}

function project(lat,lon){
  const [wx,wy]=ll2px(lat,lon,tileZoom),W=mapCanvas.width,H=mapCanvas.height;
  return [wx-vpx+W/2,wy-vpy+H/2];
}

// ── CURSOR SYNC ───────────────────────────────────────────────────────────────
// global_km → {lat,lon} using map_kms (same coordinate system as ele[][0])
function gkmToLatLon(gkm, sb, stages){
  // find stage
  let si=sb.length-1;
  for(let i=0;i<sb.length;i++){if(gkm<=sb[i].e+0.01){si=i;break;}}
  const localKm=Math.max(0,gkm-sb[si].s);
  const kms=stages[si].map_kms;
  const pts=stages[si].map_points;
  // binary search
  let lo=0,hi=kms.length-1;
  while(lo<hi-1){const mid=(lo+hi)>>1;if(kms[mid]<=localKm)lo=mid;else hi=mid;}
  // interpolate
  const span=kms[hi]-kms[lo];
  const t=span>0?Math.min(1,(localKm-kms[lo])/span):0;
  return {lat:pts[lo][0]+(pts[hi][0]-pts[lo][0])*t,
           lon:pts[lo][1]+(pts[hi][1]-pts[lo][1])*t};
}

// {lat,lon} → global_km using map_kms
function latLonToGkm(lat,lon,sb,stages){
  let best=null,bd=1e9;
  stages.forEach((s,i)=>{
    const off=sb[i].s, pts=s.map_points, kms=s.map_kms;
    pts.forEach((pt,j)=>{
      const d=Math.hypot(pt[0]-lat,pt[1]-lon)*111;
      if(d<bd){bd=d;best=off+kms[j];}
    });
  });
  return best;
}

// ── DRAW MAP ──────────────────────────────────────────────────────────────────
const visM=MAIN.map(()=>true),visO=OPT.map(()=>true);

function lbl(text,x,y,fontSize,italic,alpha){
  mc.save();mc.globalAlpha=alpha??1;
  mc.font=(italic?'italic ':'')+`bold ${fontSize}px sans-serif`;
  mc.textAlign='left';mc.textBaseline='middle';
  mc.lineJoin='round';mc.lineWidth=3.5;
  mc.strokeStyle='rgba(0,0,0,0.9)';mc.strokeText(text,x,y);
  mc.fillStyle='#fff';mc.fillText(text,x,y);
  mc.restore();
}

function drawMap(){
  const W=mapCanvas.width,H=mapCanvas.height;
  if(!W||!H||!vpx) return;
  mc.fillStyle='#1a1a2e';mc.fillRect(0,0,W,H);

  const n=Math.pow(2,tileZoom),tlWx=vpx-W/2,tlWy=vpy-H/2;
  const tx0=Math.floor(tlWx/TILE_SIZE),ty0=Math.floor(tlWy/TILE_SIZE);
  const tx1=Math.ceil((tlWx+W)/TILE_SIZE),ty1=Math.ceil((tlWy+H)/TILE_SIZE);
  for(let tx=tx0;tx<=tx1;tx++) for(let ty=ty0;ty<=ty1;ty++){
    const txw=((tx%n)+n)%n;
    if(ty<0||ty>=n) continue;
    const img=getTile(tileZoom,txw,ty);
    if(img.loaded){
      mc.globalAlpha=0.8;
      mc.drawImage(img,Math.round(tx*TILE_SIZE-tlWx),Math.round(ty*TILE_SIZE-tlWy),TILE_SIZE,TILE_SIZE);
      mc.globalAlpha=1;
    }
  }
  mc.fillStyle='rgba(0,0,10,0.28)';mc.fillRect(0,0,W,H);

  OPT.forEach((s,i)=>{
    if(!visO[i]) return;
    const pts=s.map_points.map(p=>project(p[0],p[1]));
    mc.beginPath();pts.forEach((p,j)=>j?mc.lineTo(p[0],p[1]):mc.moveTo(p[0],p[1]));
    mc.strokeStyle=COLORS[i];mc.lineWidth=2.2;mc.globalAlpha=.58;
    mc.setLineDash([8,6]);mc.stroke();mc.setLineDash([]);mc.globalAlpha=1;
  });

  MAIN.forEach((s,i)=>{
    if(!visM[i]) return;
    const pts=s.map_points.map(p=>project(p[0],p[1]));
    mc.beginPath();pts.forEach((p,j)=>j?mc.lineTo(p[0],p[1]):mc.moveTo(p[0],p[1]));
    mc.strokeStyle=COLORS[i];mc.lineWidth=10;mc.globalAlpha=.15;mc.stroke();mc.globalAlpha=1;
    mc.beginPath();pts.forEach((p,j)=>j?mc.lineTo(p[0],p[1]):mc.moveTo(p[0],p[1]));
    mc.strokeStyle=COLORS[i];mc.lineWidth=3.5;mc.globalAlpha=.97;mc.stroke();mc.globalAlpha=1;
  });

  MAIN.forEach((s,i)=>{
    if(!visM[i]) return;
    const [x,y]=project(s.map_points[0][0],s.map_points[0][1]);
    mc.beginPath();mc.arc(x,y,8,0,Math.PI*2);mc.fillStyle=COLORS[i];mc.fill();
    mc.strokeStyle='#fff';mc.lineWidth=1.8;mc.stroke();
    mc.fillStyle='#000';mc.font='bold 8px sans-serif';mc.textAlign='center';mc.textBaseline='middle';
    mc.fillText(i+1,x,y);
  });

  CITIES.forEach(c=>{
    const [x,y]=project(c.lat,c.lon);
    mc.beginPath();mc.arc(x,y,3.5,0,Math.PI*2);mc.fillStyle='#fff';mc.fill();
    mc.strokeStyle='rgba(0,0,0,.7)';mc.lineWidth=1;mc.stroke();
    lbl(c.name,x+7,y,9,false,1);
  });

  MAIN_PASSES.forEach(p=>{
    const [x,y]=project(p.lat,p.lon);const col=COLORS[p.stage-1];
    mc.beginPath();mc.moveTo(x,y-2);mc.lineTo(x-5,y-11);mc.lineTo(x+5,y-11);mc.closePath();
    mc.fillStyle=col;mc.fill();mc.strokeStyle='rgba(0,0,0,.6)';mc.lineWidth=1;mc.stroke();
    lbl(p.name,x+6,y-7,8.5,false,1);
  });

  OPT_ONLY.forEach(p=>{
    const [x,y]=project(p.lat,p.lon);const col=COLORS[p.stage-1];
    mc.beginPath();mc.moveTo(x,y-2);mc.lineTo(x-5,y-11);mc.lineTo(x+5,y-11);mc.closePath();
    mc.fillStyle='rgba(0,0,0,0.4)';mc.fill();mc.strokeStyle=col;mc.lineWidth=1.8;mc.stroke();
    lbl(p.name+' ◦',x+6,y-7,8.5,false,1);
  });

  const sp=MAIN[0].map_points[0],[sx,sy]=project(sp[0],sp[1]);
  mc.beginPath();mc.arc(sx,sy,9,0,Math.PI*2);mc.fillStyle='#fff';mc.fill();
  mc.strokeStyle=COLORS[0];mc.lineWidth=2.5;mc.stroke();
  mc.fillStyle='#000';mc.font='bold 7.5px sans-serif';mc.textAlign='center';mc.textBaseline='middle';mc.fillText('S',sx,sy);

  const fp=MAIN[7].map_points[MAIN[7].map_points.length-1],[fx,fy]=project(fp[0],fp[1]);
  mc.beginPath();mc.arc(fx,fy,9,0,Math.PI*2);mc.fillStyle='#fff';mc.fill();
  mc.strokeStyle=COLORS[7];mc.lineWidth=2.5;mc.stroke();
  mc.fillStyle='#000';mc.font='bold 7.5px sans-serif';mc.textAlign='center';mc.textBaseline='middle';mc.fillText('F',fx,fy);

  if(mapCursor){
    const [x,y]=project(mapCursor.lat,mapCursor.lon);
    mc.beginPath();mc.arc(x,y,6,0,Math.PI*2);
    mc.fillStyle='rgba(255,255,255,.9)';mc.fill();
    mc.strokeStyle='rgba(0,0,0,.5)';mc.lineWidth=2;mc.stroke();
  }
}

// ── PAN / ZOOM ────────────────────────────────────────────────────────────────
let isPan=false,panStart=null,panVpx=null,panVpy=null,mapCursor=null;

mapCanvas.addEventListener('mousedown',e=>{
  isPan=true;panStart={x:e.clientX,y:e.clientY};panVpx=vpx;panVpy=vpy;
});
mapCanvas.addEventListener('mousemove',e=>{
  if(isPan&&panStart){
    vpx=panVpx-(e.clientX-panStart.x);vpy=panVpy-(e.clientY-panStart.y);
    drawMap();return;
  }
  const px=e.clientX,py=e.clientY-MAP_TOP;
  let nearest=null,nd=18;
  [[MAIN,false],[OPT,true]].forEach(([stages,isOpt])=>
    stages.forEach((s,i)=>s.map_points.forEach((pt,j)=>{
      const [sx,sy]=project(pt[0],pt[1]);
      const d=Math.hypot(sx-px,sy-py);
      if(d<nd){nd=d;nearest={lat:pt[0],lon:pt[1],stage:i+1,isOpt,
        gkm:(isOpt?sbO:sbM)[i].s+s.map_kms[j]};}
    }))
  );
  if(nearest){
    mapCursor={lat:nearest.lat,lon:nearest.lon};
    if(nearest.isOpt){hoverO=nearest.gkm;hoverM=null;}
    else{hoverM=nearest.gkm;hoverO=null;}
    redraw();drawMap();
    maptip.style.display='block';
    maptip.style.left=Math.min(e.clientX+10,getVW()-170)+'px';
    maptip.style.top=(e.clientY-30)+'px';
    maptip.innerHTML=(nearest.isOpt
      ?'<span style="color:#ffaa3c">&#8943; Optional</span>'
      :'<span style="color:#60c8ff">&#9679; Main</span>')+' J'+nearest.stage;
  }else{
    if(mapCursor){mapCursor=null;hoverM=null;hoverO=null;redraw();drawMap();}
    maptip.style.display='none';
  }
});
mapCanvas.addEventListener('mouseup',()=>{isPan=false;});
mapCanvas.addEventListener('mouseleave',()=>{
  isPan=false;mapCursor=null;hoverM=null;hoverO=null;
  maptip.style.display='none';redraw();drawMap();
});
mapCanvas.addEventListener('wheel',e=>{
  e.preventDefault();
  const W=mapCanvas.width,H=mapCanvas.height;
  const mx=e.clientX,my=e.clientY-MAP_TOP,oldZ=tileZoom;
  tileZoom=Math.max(5,Math.min(14,tileZoom+(e.deltaY<0?1:-1)));
  if(tileZoom!==oldZ){
    const scale=Math.pow(2,tileZoom-oldZ);
    vpx=(vpx-W/2+mx)*scale-mx+W/2;
    vpy=(vpy-H/2+my)*scale-my+H/2;
    drawMap();
  }
},{passive:false});

// ── LEGEND ────────────────────────────────────────────────────────────────────
function makeLeg(id,stages,vis,isOpt){
  const el=document.getElementById(id);
  stages.forEach((s,i)=>{
    const it=document.createElement('div');it.className='li';
    const dot=isOpt
      ?`<div class="ldk" style="color:${COLORS[i]};"></div>`
      :`<div class="ld" style="background:${COLORS[i]};box-shadow:0 0 4px ${COLORS[i]}88;"></div>`;
    it.innerHTML=dot+`J${i+1}<span class="lkm">${s.dist_km}km</span>`;
    it.onclick=()=>{vis[i]=!vis[i];it.classList.toggle('dim',!vis[i]);drawMap();};
    el.appendChild(it);
  });
}
makeLeg('leg-m',MAIN,visM,false);
makeLeg('leg-o',OPT,visO,true);

// ── ELEVATION PROFILES ────────────────────────────────────────────────────────
const canM=document.getElementById('canM'),ctxM=canM.getContext('2d');
const canO=document.getElementById('canO'),ctxO=canO.getContext('2d');

// Flat elevation arrays with global km
const eFM=[],eFO=[];
MAIN.forEach((s,i)=>{const off=sbM[i].s;s.ele.forEach(p=>eFM.push({g:p[0]+off,e:p[1]}))});
OPT.forEach((s,i)=>{const off=sbO[i].s;s.ele.forEach(p=>eFO.push({g:p[0]+off,e:p[1]}))});
const allE=[...eFM,...eFO].map(p=>p.e);
const EMIN=Math.min(...allE),EMAX=Math.max(...allE);
const PL=46,PR=10,PT=10,PB=18;
let pPM=[],pPO=[],hoverM=null,hoverO=null;

function tX(km,tot,W){return PL+(km/tot)*(W-PL-PR);}
function tY(e,H){return PT+(H-PT-PB)*(1-(e-EMIN)/(EMAX-EMIN));}
function fX(px,tot,W){return Math.max(0,Math.min(tot,(px-PL)/(W-PL-PR)*tot));}

function drawProf(ctx,can,stages,sb,tot,passes,pPos,isOpt,hkm){
  const W=can.offsetWidth,H=can.offsetHeight;
  if(!W||!H)return;
  can.width=W;can.height=H;
  ctx.fillStyle='#040410';ctx.fillRect(0,0,W,H);
  const step=(EMAX-EMIN)>1500?500:250;
  for(let e=Math.ceil(EMIN/step)*step;e<=EMAX;e+=step){
    const y=tY(e,H);
    ctx.strokeStyle='rgba(255,255,255,.033)';ctx.lineWidth=1;
    ctx.beginPath();ctx.moveTo(PL,y);ctx.lineTo(W-PR,y);ctx.stroke();
    ctx.fillStyle='#2a2e50';ctx.font='8px sans-serif';ctx.textAlign='right';
    ctx.fillText(e+'m',PL-2,y+3);
  }
  sb.forEach((s2,i)=>{
    if(i>0){
      const x=tX(s2.s,tot,W);
      ctx.strokeStyle='rgba(255,255,255,.055)';ctx.setLineDash([3,3]);ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(x,PT);ctx.lineTo(x,H-PB);ctx.stroke();ctx.setLineDash([]);
    }
    ctx.fillStyle=COLORS[i]+'99';ctx.font='bold 7px sans-serif';ctx.textAlign='center';
    ctx.fillText('J'+(i+1),tX((s2.s+s2.e)/2,tot,W),H-PB+12);
  });
  stages.forEach((s,i)=>{
    const off=sb[i].s,pts=s.ele.map(p=>[p[0]+off,p[1]]);
    if(!pts.length)return;
    ctx.beginPath();ctx.moveTo(tX(pts[0][0],tot,W),H-PB);
    pts.forEach(p=>ctx.lineTo(tX(p[0],tot,W),tY(p[1],H)));
    ctx.lineTo(tX(pts[pts.length-1][0],tot,W),H-PB);ctx.closePath();
    if(isOpt){
      ctx.save();ctx.clip();
      const g2=ctx.createLinearGradient(0,PT,0,H-PB);
      g2.addColorStop(0,COLORS[i]+'50');g2.addColorStop(1,COLORS[i]+'08');
      ctx.fillStyle=g2;ctx.fill();
      ctx.strokeStyle=COLORS[i]+'38';ctx.lineWidth=1;
      const x0=tX(pts[0][0],tot,W),x1=tX(pts[pts.length-1][0],tot,W);
      for(let dx=-H;dx<(x1-x0+H);dx+=9){ctx.beginPath();ctx.moveTo(x0+dx,H-PB);ctx.lineTo(x0+dx-H,PT);ctx.stroke();}
      ctx.restore();
    }else{
      const g=ctx.createLinearGradient(0,PT,0,H-PB);
      g.addColorStop(0,COLORS[i]+'cc');g.addColorStop(1,COLORS[i]+'12');
      ctx.fillStyle=g;ctx.fill();
    }
    ctx.beginPath();
    pts.forEach((p,j)=>j?ctx.lineTo(tX(p[0],tot,W),tY(p[1],H)):ctx.moveTo(tX(p[0],tot,W),tY(p[1],H)));
    ctx.strokeStyle=isOpt?COLORS[i]+'bb':COLORS[i];ctx.lineWidth=isOpt?1.6:2.1;
    if(isOpt){ctx.setLineDash([8,5]);ctx.stroke();ctx.setLineDash([]);}else ctx.stroke();
  });
  pPos.length=0;
  passes.forEach(p=>{
    const gkm=p.global_km||p.local_km,col=COLORS[p.stage-1];
    const fl=isOpt?eFO:eFM;
    let hE=EMIN,md=1e9;fl.forEach(ep=>{const d=Math.abs(ep.g-gkm);if(d<md){md=d;hE=ep.e;}});
    const x=tX(gkm,tot,W),y=tY(hE,H);
    ctx.fillStyle=col+'cc';ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-3,y-7);ctx.lineTo(x+3,y-7);ctx.closePath();ctx.fill();
    pPos.push({p,x,ty:y-7,hE});
  });
  ctx.fillStyle='#1c2038';ctx.font='7px sans-serif';ctx.textAlign='center';
  const dstep=tot>800?200:100;
  for(let d=dstep;d<tot;d+=dstep){
    const x=tX(d,tot,W);if(x>PL+15&&x<W-PR-15)ctx.fillText(d+'km',x,H-PB+12);
  }
  if(hkm!=null){
    const x=tX(hkm,tot,W);
    let hsi=0;sb.forEach((s2,ii)=>{if(hkm>=s2.s&&hkm<=s2.e+0.1)hsi=ii;});
    ctx.strokeStyle=COLORS[hsi]+'88';ctx.lineWidth=1;ctx.setLineDash([4,3]);
    ctx.beginPath();ctx.moveTo(x,PT);ctx.lineTo(x,H-PB);ctx.stroke();ctx.setLineDash([]);
    const fl=isOpt?eFO:eFM;let hE=EMIN,md=1e9;
    fl.forEach(ep=>{const d=Math.abs(ep.g-hkm);if(d<md){md=d;hE=ep.e;}});
    ctx.beginPath();ctx.arc(x,tY(hE,H),4,0,Math.PI*2);ctx.fillStyle=COLORS[hsi];ctx.fill();
    ctx.strokeStyle='#000';ctx.lineWidth=1.5;ctx.stroke();
    let np=null,nd2=18;pPos.forEach(pp=>{const d=Math.abs(pp.x-x);if(d<nd2){nd2=d;np=pp;}});
    if(np){
      const col=COLORS[np.p.stage-1],nm=np.p.name;
      ctx.font='bold 10.5px sans-serif';const tw=ctx.measureText(nm).width;
      const bx=Math.max(PL,Math.min(W-PR-tw-9,np.x-tw/2-4)),by=Math.max(PT+2,np.ty-30);
      ctx.fillStyle='rgba(2,2,12,.95)';ctx.fillRect(bx,by,tw+9,32);
      ctx.strokeStyle=col;ctx.lineWidth=1;ctx.strokeRect(bx,by,tw+9,32);
      ctx.fillStyle=col;ctx.textAlign='left';ctx.fillText(nm,bx+4,by+13);
      ctx.font='9px sans-serif';ctx.fillStyle=col+'bb';
      ctx.fillText(np.p.ele+'m · J'+np.p.stage,bx+4,by+26);
    }
  }
}

function redraw(){
  drawProf(ctxM,canM,MAIN,sbM,TOTM,MAIN_PASSES,pPM,false,hoverM);
  drawProf(ctxO,canO,OPT,sbO,TOTO,OPT_PASSES,pPO,true,hoverO);
}

// Elevation profile → map cursor
canM.addEventListener('mousemove',e=>{
  const r=canM.getBoundingClientRect();
  hoverM=fX((e.clientX-r.left)*(canM.width/r.width),TOTM,canM.width);
  hoverO=null;
  mapCursor=gkmToLatLon(hoverM,sbM,MAIN);
  redraw();drawMap();
  showEtip(e.clientX,e.clientY,hoverM,sbM,false);
});
canM.addEventListener('mouseleave',()=>{hoverM=null;mapCursor=null;etip.style.display='none';redraw();drawMap();});

canO.addEventListener('mousemove',e=>{
  const r=canO.getBoundingClientRect();
  hoverO=fX((e.clientX-r.left)*(canO.width/r.width),TOTO,canO.width);
  hoverM=null;
  mapCursor=gkmToLatLon(hoverO,sbO,OPT);
  redraw();drawMap();
  showEtip(e.clientX,e.clientY,hoverO,sbO,true);
});
canO.addEventListener('mouseleave',()=>{hoverO=null;mapCursor=null;etip.style.display='none';redraw();drawMap();});

function showEtip(cx,cy,gkm,sb,isOpt){
  let hsi=0;sb.forEach((s2,i)=>{if(gkm>=s2.s&&gkm<=s2.e+0.1)hsi=i;});
  const fl=isOpt?eFO:eFM;let hE=EMIN,md=1e9;
  fl.forEach(ep=>{const d=Math.abs(ep.g-gkm);if(d<md){md=d;hE=ep.e;}});
  const tag=isOpt?'<span style="color:#ffaa3c">&#8943; Optional</span>':'<span style="color:#60c8ff">&#9679; Main</span>';
  const can=isOpt?canO:canM,tot=isOpt?TOTO:TOTM;
  const W=can.offsetWidth||800,x=tX(gkm,tot,W);
  const pp=isOpt?pPO:pPM;let np=null,nd=18;
  pp.forEach(p=>{const d=Math.abs(p.x-x);if(d<nd){nd=d;np=p;}});
  etip.style.display='block';
  etip.style.left=Math.min(cx+12,getVW()-220)+'px';
  etip.style.top=(cy-46)+'px';
  let h=tag+' <b>J'+(hsi+1)+'</b> &nbsp;'+gkm.toFixed(1)+'km &nbsp;<b>'+Math.round(hE)+'m</b>';
  if(np)h+='<br><span style="color:'+COLORS[np.p.stage-1]+';font-weight:600">&#9651; '+np.p.name+' ('+np.p.ele+'m)</span>';
  etip.innerHTML=h;
}

function init(){sizeAll();drawMap();redraw();}
window.addEventListener('resize',()=>{sizeAll();drawMap();redraw();});
init();
</script>
